name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Scan tracked files for local secrets
        shell: bash
        run: |
          if git grep -nE 'subscription-key=[A-Za-z0-9]|METRO_(GTFS|TRANSIT_DATA)_API_KEY=[^r]' -- ':!*.example'; then
            echo "Potential METRO credential found in a tracked file."
            exit 1
          fi
