<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A clean MCP server for Houston METRO routes, stops, realtime arrivals, and service alerts." />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Houston METRO MCP</title>
    <script>
      try {
        const theme = localStorage.getItem("metro-theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
